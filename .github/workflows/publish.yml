# Publishes a version of the development repo in the public repo. It starts when an annotated tag vX.Y.Z is pushed
# (the merge of the version pull request, already on dev): the content of that commit becomes one new commit on top
# of the public main, on branch release/X.Y.Z, with the CHANGELOG section as its message, and a pull request that
# the owner merges. Only in the development repo: in the public repo (which receives this same file) every job is
# skipped.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # fallback, for an existing tag (for example, after fixing a missing secret)
    inputs:
      tag:
        description: "Tag que ya existe (vX.Y.Z)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PUBLIC_REPO: JLarry00/orquesta
  PUBLISH_NAME: JLarry00
  PUBLISH_EMAIL: 202979278+JLarry00@users.noreply.github.com
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # The same checks as on every push, on the tagged commit: if they fail, nothing is published.
  checks:
    if: github.repository == 'JLarry00/orquesta-dev' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    secrets:
      FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches (origin/dev) and tags, annotated ones as they are
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Commit de publicación en release/<versión> y PR en el público
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -eu
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto PUBLIC_REPO_TOKEN (docs/flujo-de-trabajo.md)."; exit 1
          fi
          python scripts/publish.py --tag "$TAG" --dev-ref origin/dev --push --pr "$PUBLIC_REPO" \
            --public "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git"
